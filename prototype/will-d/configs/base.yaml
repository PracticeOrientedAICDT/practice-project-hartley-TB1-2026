project:
  name: latency_sensitive_neural_accelerator
  seed: 12345
  task: cartpole
timing:
  environment_timestep_ns: 20000000
  max_episode_steps: 500
training:
  algorithm: ppo
  learning_rate: 2.5e-4
  anneal_lr: true
  num_envs: 4
  steps_per_decision: 128
  num_minibatches: 4
  update_epochs: 4
  clip_coef: 0.2
  gae_lambda_phys: 0.95
  gamma_phys: 0.99
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  norm_adv: true
  clip_vloss: true









  total_integration_steps: 4000000
  control_training_seeds: 10


















  discount_overrides:
    lunarlander:
      basis: decision
      gamma: 0.999
      gae_lambda: 0.98
evaluation:
  control_episodes_per_seed: 200
  eval_seed_base: 10000
  paired_evaluation: true
policy:
  control_hidden_layers: [128, 128]
  hft_small: [32, 32]
  hft_large: [128, 128]
  hft_output_actions: [0, 1, 2]
latency:
  sweep_grid_ns: [20000000, 40000000, 60000000, 80000000, 100000000]
  hft_grid_ns:
    - 100
    - 300
    - 1000
    - 3000
    - 10000
    - 30000
    - 100000
    - 300000
    - 1000000
    - 3000000
    - 10000000
    - 30000000
    - 100000000
hardware:
  max_layers: 4
  max_width: 256
  precision: TBD
  peak_macs_per_second: TBD
  fixed_overhead_ns: TBD
  memory_bytes: TBD
  fast_execution_source: hartley_parameterised_model
  slow_execution_source: conventional_reference
environment_kwargs: {}
finance:
  source: synthetic
  data_path: data/synthetic
  execution_model: aggressive
  transaction_cost_bps: 1.0
  prediction_horizon_events: 10
  synthetic:



    seed: 7
    n_events: 200000
    trigger_prob: 0.02
    mean_persistence_events: 25.0
    drift_per_event: 0.02
    noise_per_event: 0.05
    flow_sensitivity: 0.25
    base_spread: 0.01
    base_size: 100.0
