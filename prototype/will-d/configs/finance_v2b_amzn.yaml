# Frozen V2B: AMZN, held out for cross-symbol validation.
#
# Everything about the target is fixed in PROTOCOL.md section 12 and is NOT set
# here: H, k, the band rule, the execution model and the latency grid all come from
# the frozen spec or from --arm / --latency-grid-ns, so that a config file cannot
# quietly become a second place to change the experiment. This file names the data
# and nothing else.
#
# The session is the one the oracle ceiling was frozen on. The ceiling records the
# stream's content hash, and stage-a refuses to report V_policy/V_oracle against a
# ceiling measured on different bytes -- so changing data_path without re-freezing
# fails loudly rather than producing a ratio that means nothing.
extends: finance.yaml

finance:
  source: lobster_sample
  data_path: data/lobster/LOBSTER_SampleFile_AMZN_2012-06-21_10

# Amplitudes are in price units, so bps of a ~130 unit mid is a fraction of a
# granule. Held at the synthetic value for comparability; the crossing spread
# dominates by an order of magnitude and is what the target was selected against.
transaction_cost_bps: 1.0