[project]
name = "latency-ml"
version = "0.1.0"
description = "Latency-sensitive neural inference for control and financial decision-making"
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    # Pinned deliberately. See docs/ENVIRONMENT.md for why each is exact.
    #
    # NEVER use `gymnasium[all]`: as of 1.3.0 that extra still pins
    # box2d-py==2.3.5, which has no macOS arm64 wheel and collides with
    # `box2d` on the same `Box2D` import name.
    "gymnasium==1.3.0",
    "numpy>=2.4,<3",
    # CPU only. The MPS torch.multinomial fix (pytorch#192577) is 7 commits
    # past the v2.14.0 tag, so MPS action sampling is unsafe for PPO.
    "pyyaml>=6.0",
    "torch==2.14.0",
]

[project.optional-dependencies]
# LunarLander only. Kept out of the base dependency set so CartPole work
# does not depend on Box2D resolving.
box2d = [
    "box2d==2.3.10",
    "pygame-ce>=2.1.3",
]

[project.scripts]
latency-ml = "latency_ml.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0.12.20260906",
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/latency_ml"]

[tool.ruff]
line-length = 200
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "SIM", "RUF",
]
ignore = [
    "ANN401", # allow `Any` where it is genuinely dynamic
    # Domain exception names are deliberate and referenced by name in
    # CODE_PLAN.md and docs, so they do not take an `Error` suffix.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201", "ANN001"]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_reexport = false

[[tool.mypy.overrides]]
# These ship without complete type information.
module = ["Box2D.*", "pygame.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# -m "not slow" keeps the default suite fast; `make test-slow` runs the rest.
addopts = "-q --strict-markers --strict-config -m 'not slow'"
filterwarnings = [
    # Gymnasium/Box2D emit these during env construction; not actionable here.
    "ignore::DeprecationWarning:Box2D.*",
    "ignore::DeprecationWarning:pygame.*",
]
markers = [
    "slow: tests that train a policy or sweep a latency grid",
    "requires_box2d: needs the box2d extra installed",
    "requires_lobster: needs downloaded LOBSTER sample data",
]
