name: PR template check

# Pass/fail gate on the PR template. No bot comments -- a red or green
# job like lint. Draft PRs are skipped; the check runs once the PR is
# marked ready for review (ready_for_review).
on:
  pull_request:
    branches: [main, dev]
    types: [opened, edited, synchronize, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  pr-template-check:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Check PR body adheres to template
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          uv run --no-sync python - <<'EOF'
          import os
          import re
          import sys

          body = os.environ.get("PR_BODY") or ""
          failures = []

          if not re.search(r"closes\s+#\d+", body, re.IGNORECASE):
              failures.append('Missing "Closes #N" with a real issue number.')

          section = re.search(
              r"^##\s+Test evidence\s*$(.*?)(?=^##\s+|\Z)",
              body,
              re.IGNORECASE | re.MULTILINE | re.DOTALL,
          )
          boxes = (
              re.findall(r"^\s*-\s*\[([ xX])\]", section.group(1), re.MULTILINE)
              if section
              else []
          )
          if not boxes:
              failures.append('No tickable boxes under "## Test evidence".')
          elif any(box == " " for box in boxes):
              failures.append("Unticked test-evidence box.")

          if failures:
              print("PR template check failed:")
              for failure in failures:
                  print(f"  - {failure}")
              sys.exit(1)
          print("PR template check passed.")
          EOF
