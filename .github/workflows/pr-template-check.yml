name: PR template check

# Pass/fail gate on the PR template. No bot comments -- a red or green
# job like lint. Draft PRs are skipped; the check runs once the PR is
# marked ready for review (ready_for_review).
on:
  pull_request:
    branches: [main, dev]
    types: [opened, edited, synchronize, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  pr-template-check:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Check PR body adheres to template
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" | uv run --no-sync python scripts/check_pr_template.py
