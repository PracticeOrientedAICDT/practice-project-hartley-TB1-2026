[project]
name = "hartley-prototype"
version = "0.1.0"
description = "Hartley prototype"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
latency-ml = "latency_ml.cli:main"

[project.optional-dependencies]
prototype-will-d = ["gymnasium==1.3.0","numpy>=2.4,<3","pyyaml>=6.0","torch==2.14.0","box2d==2.3.10","pygame-ce>=2.1.3"]


[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, isolated unit tests (<0.1s each)",
    "integration: slower cross-module wiring tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prototype/will-d/src/latency_ml"]

[tool.ty.src]
# Exploratory spikes under prototype/ carry their own dependency stacks
# (e.g. torch) that are not installed in the repo-root environment, so ty
# cannot resolve their third-party imports. Keep them out of root type
# checking; ruff still lints them.
exclude = ["prototype"]

[tool.ty.environment]
python-version = "3.12"
