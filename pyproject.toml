[project]
name = "hartley-prototype"
version = "0.1.0"
description = "Hartley prototype"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.pytest.ini_options]
testpaths = ["tests", "unit/scripts"]
markers = [
    "unit: fast, isolated unit tests (<0.1s each)",
    "integration: slower cross-module wiring tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.environment]
python-version = "3.12"
