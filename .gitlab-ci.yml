stages: [lint, test]

variables:
  UV_PYTHON: "3.12"
  UV_FROZEN: "1"

.base-setup:
  image: python:3.12-slim
  before_script:
    - pip install --no-cache-dir uv
    - uv sync --frozen

lint:
  extends: .base-setup
  stage: lint
  script:
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run ty check
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

pytest-unit:
  extends: .base-setup
  stage: test
  script:
    - uv run pytest tests/unit -m unit
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH

pytest-integration:
  extends: .base-setup
  stage: test
  script:
    - uv run pytest tests/integration -m integration
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH
